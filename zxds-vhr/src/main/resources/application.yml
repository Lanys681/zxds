server:
  jetty:
    threads:
      acceptors: 4
      selectors: 8
  port: 8008
  servlet:
    context-path: /
    multipart:
      max-request-size: 10MB
      max-file-size: 2MB

spring:
  profiles:
    #引用application-common.yml文件
    include: common
  application:
    name: zxds-vhr
  cloud:
    inetutils:
      #子系统注册到 Nacos 上的 IP 地址
      preferred-networks: 192.168.213.137
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://192.168.213.137:12001/zxds_vhr?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
      username: root
      password: abc123456
      initial-size: 4
      max-active: 8
      min-idle: 8
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.example.zxds.vhr.db.pojo
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

logging:
  level:
    root: info
    com.example.zxds.vhr.db.dao: warn
  pattern:
    console: "%d{yyyy/MM/dd HH:mm:ss}  %-5level  %msg%n"

springdoc:
  api-docs:
    enabled: true
    path: /doc-api.html
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: on

# seata 实现分布式事务
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: vhr_tx_group
  service:
    vgroup-mapping:
      vhr_tx_group: default
  registry:
    type: file
  config:
    type: file

feign:
  client:
    config:
      default:
        connectTimeout: 10000
        readTimeout: 300000
