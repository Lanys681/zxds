server:
  jetty:
    threads:
      acceptors: 4
      selectors: 8
  port: 8001
  servlet:
    context-path: /

spring:
  profiles:
    #引用application-common.yml文件
    include: common
  application:
    name: zxds-dr
  cloud:
    inetutils:
      #子系统注册到Nacos上的IP地址
      preferred-networks: 192.168.213.137
    nacos:
      #配置子系统在Web管理页面上的注册信息
      config:
        group: DEFAULT_GROUP
        file-extension: yaml
        server-addr: 192.168.213.137:8848
        prefix: ${spring.application.name}
        namespace: zxds
      #配置子系统在Nacos上的注册信息
      discovery:
        namespace: zxds
        username: nacos
        password: nacos
        server-addr: 192.168.213.137:8848
        heart-beat-interval: 1000
        heart-beat-timeout: 1000
        group: DEFAULT_GROUP

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://192.168.213.137:12001/zxds_dr?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
      username: root
      password: abc123456
      initial-size: 4
      max-active: 8
      min-idle: 8
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.example.zxds.dr.db.pojo
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

logging:
  level:
    root: info
    com.example.zxds.dr.db.dao: warn
  pattern:
    console: "%d{yyyy/MM/dd HH:mm:ss}  %-5level  %msg%n"

springdoc:
  api-docs:
    enabled: true
    path: /doc-api.html
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: on

# seata 实现分布式事务
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: dr_tx_group
  service:
    vgroup-mapping:
      dr_tx_group: default
  registry:
    type: file
  config:
    type: file

feign:
  client:
    config:
      default:
        connectTimeout: 10000
        readTimeout: 300000
